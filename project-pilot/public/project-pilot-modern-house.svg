<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Modern home at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb6df"/>
      <stop offset=".48" stop-color="#5277a5"/>
      <stop offset="1" stop-color="#203a5c"/>
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#304b43"/>
      <stop offset="1" stop-color="#122d2a"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#27333f"/>
      <stop offset="1" stop-color="#101922"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#554a3e"/>
      <stop offset="1" stop-color="#2f2b27"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffd892"/>
      <stop offset=".58" stop-color="#be7e32"/>
      <stop offset="1" stop-color="#6f3f14"/>
    </linearGradient>
    <linearGradient id="drive" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9aa3a8"/>
      <stop offset="1" stop-color="#4e5963"/>
    </linearGradient>
    <radialGradient id="warmGlow">
      <stop stop-color="#ffd990" stop-opacity=".76"/>
      <stop offset="1" stop-color="#f5a22f" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#061325" flood-opacity=".42"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1200" height="720" fill="url(#sky)"/>
  <ellipse cx="710" cy="560" rx="410" ry="120" fill="url(#warmGlow)" filter="url(#blur)"/>
  <path d="M0 402 C140 350 220 382 350 338 C480 296 545 324 690 292 C850 257 1030 286 1200 238 L1200 720 L0 720Z" fill="#173334" opacity=".82"/>
  <rect y="506" width="1200" height="214" fill="url(#lawn)"/>

  <!-- distant trees -->
  <g opacity=".88" fill="#122b2d">
    <path d="M28 430 90 225 152 430Z"/><path d="M112 430 182 190 248 430Z"/><path d="M950 430 1025 190 1095 430Z"/><path d="M1035 430 1110 150 1190 430Z"/>
    <circle cx="930" cy="310" r="112"/><circle cx="1080" cy="285" r="126"/>
  </g>

  <!-- driveway -->
  <path d="M646 545 1200 476 1200 720 770 720Z" fill="url(#drive)"/>
  <path d="M664 573 1200 520" stroke="#d3d6d8" stroke-opacity=".24" stroke-width="4"/>
  <path d="M708 622 1200 586" stroke="#d3d6d8" stroke-opacity=".18" stroke-width="4"/>

  <!-- house -->
  <g filter="url(#shadow)">
    <rect x="345" y="304" width="492" height="250" rx="4" fill="url(#wall)"/>
    <rect x="745" y="358" width="337" height="196" rx="4" fill="url(#wall)"/>
    <rect x="404" y="215" width="365" height="160" rx="4" fill="#1a2632"/>
    <rect x="541" y="187" width="300" height="188" rx="4" fill="#26313d"/>
    <rect x="344" y="292" width="520" height="30" rx="3" fill="#101820"/>
    <polygon points="378,208 870,150 906,179 430,240" fill="#101820"/>
    <polygon points="709,302 1120,286 1140,318 726,333" fill="#101820"/>
    <rect x="608" y="302" width="93" height="252" fill="url(#stone)"/>
    <rect x="755" y="381" width="281" height="173" rx="2" fill="#17232e"/>
    <g stroke="#4e5e6b" stroke-width="5" opacity=".7">
      <line x1="770" y1="410" x2="1020" y2="410"/><line x1="770" y1="442" x2="1020" y2="442"/><line x1="770" y1="474" x2="1020" y2="474"/><line x1="770" y1="506" x2="1020" y2="506"/>
    </g>

    <!-- warm windows -->
    <g fill="url(#glass)" stroke="#0b141c" stroke-width="8">
      <rect x="434" y="235" width="78" height="103"/>
      <rect x="518" y="225" width="78" height="113"/>
      <rect x="708" y="221" width="89" height="117"/>
      <rect x="798" y="220" width="43" height="118"/>
      <rect x="382" y="351" width="92" height="139"/>
      <rect x="480" y="351" width="112" height="139"/>
      <rect x="708" y="352" width="38" height="139"/>
    </g>
    <g stroke="#fff0c6" stroke-opacity=".45" stroke-width="2">
      <line x1="473" y1="236" x2="473" y2="337"/><line x1="557" y1="226" x2="557" y2="337"/>
      <line x1="752" y1="222" x2="752" y2="337"/><line x1="428" y1="352" x2="428" y2="489"/>
      <line x1="536" y1="352" x2="536" y2="489"/>
    </g>

    <!-- entry and exterior lighting -->
    <rect x="639" y="370" width="45" height="184" fill="#101820"/>
    <rect x="648" y="395" width="27" height="126" fill="#8e5a24" opacity=".8"/>
    <g fill="#ffe0a0">
      <circle cx="371" cy="356" r="8"/><circle cx="727" cy="356" r="8"/><circle cx="1042" cy="383" r="8"/>
    </g>
    <g fill="url(#warmGlow)" opacity=".7">
      <ellipse cx="371" cy="380" rx="45" ry="70"/><ellipse cx="727" cy="380" rx="45" ry="70"/><ellipse cx="1042" cy="410" rx="45" ry="70"/>
    </g>
  </g>

  <!-- landscaping -->
  <g fill="#19392f">
    <ellipse cx="342" cy="552" rx="120" ry="34"/><ellipse cx="541" cy="573" rx="160" ry="38"/>
    <ellipse cx="1000" cy="569" rx="170" ry="46"/>
  </g>
  <g fill="#476d55">
    <circle cx="310" cy="526" r="34"/><circle cx="360" cy="532" r="42"/><circle cx="515" cy="546" r="28"/>
    <circle cx="942" cy="535" r="35"/><circle cx="1015" cy="527" r="46"/><circle cx="1080" cy="542" r="30"/>
  </g>
  <g fill="#ffe0a0" opacity=".9">
    <circle cx="475" cy="587" r="6"/><circle cx="926" cy="591" r="6"/><circle cx="1088" cy="590" r="6"/>
  </g>
</svg>
